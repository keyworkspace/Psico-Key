<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenteGest · Gestión para psicólogos</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">🧠 <span>MenteGest</span></div>
      <nav class="menu">
        <a href="#/dashboard" data-view="dashboard"><span>📊</span> Dashboard</a>
        <a href="#/agenda" data-view="agenda"><span>📅</span> Agenda</a>
        <a href="#/pacientes" data-view="pacientes"><span>👥</span> Pacientes</a>
        <a href="#/notas" data-view="notas"><span>📝</span> Notas de sesión</a>
        <a href="#/finanzas" data-view="finanzas"><span>💰</span> Finanzas</a>
        <a href="#/config" data-view="config"><span>⚙️</span> Configuración</a>
      </nav>
      <div class="sidebar-footer">
        <small>Datos guardados localmente 🔒</small>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <p id="viewSubtitle" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <button id="btnAccion" class="btn-primary hidden">+ Nuevo</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- MODAL GENÉRICO -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span class="close" id="modalClose">&times;</span>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <!-- CONFIRM -->
  <div id="confirm" class="modal hidden">
    <div class="modal-content small">
      <h2 id="confirmTitle">¿Estás seguro?</h2>
      <p id="confirmMsg" class="muted"></p>
      <div class="confirm-actions">
        <button class="btn-outline" id="confirmNo">Cancelar</button>
        <button class="btn-danger" id="confirmYes">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
